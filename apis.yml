name: theCut
description: theCut is a mobile application and web platform that connects clients with barbers and hair
  professionals across all 50 U.S. states. Users find a barber near them, browse portfolio photos and
  verified reviews, see upfront pricing, book and confirm appointments in real time, message their barber
  in-app, and pay with cards, Apple Pay, Google Pay, or Cash App Pay. The service has facilitated over
  100 million haircut bookings. theCut publishes no public developer API or documentation; this profile
  is maintained in the API Evangelist network as a company record.
